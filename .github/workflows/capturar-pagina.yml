name: Capturar página para teste
# Baixa páginas https://www.gov.br/... e grava o HTML numa branch captura/<execução>, para virar fixture de teste
# (fora do Actions não há acesso ao gov.br). Não toca no main nem em data/.
on:
  workflow_dispatch:
    inputs:
      enderecos:
        description: 'Endereços https://www.gov.br/... separados por espaço (aceita ?b_start:int=N)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Guarda o token de propósito: o job faz push da branch de captura.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baixar e gravar na branch de captura
        env:
          ENDERECOS: ${{ inputs.enderecos }}
          RAMO: captura/${{ github.run_id }}
          UA: 'Mozilla/5.0 (X11; Linux x86_64) RastreadorPresidente/0.1 (+${{ github.server_url }}/${{ github.repository }})'
        run: |
          permitido='^https://www\.gov\.br/[A-Za-z0-9._~/@+%=:-]*(\?b_start:int=[0-9]+)?$'
          git switch -q --orphan "$RAMO"
          mkdir -p captura
          n=0
          for u in $ENDERECOS; do
            if ! [[ "$u" =~ $permitido ]]; then
              echo "Ignorado: só https://www.gov.br/... (parâmetro aceito: ?b_start:int=N): $u"
              continue
            fi
            n=$((n + 1))
            arq="captura/$n.html"
            curl -sS -L -m 30 -A "$UA" -H 'Accept: text/html' -o "$arq" \
              -w "$n | HTTP %{http_code} | %{content_type} | final: %{url_effective} | $u\n" "$u" | tee -a captura/indice.txt
            sleep 1
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add captura
          git commit -q -m "captura de páginas para fixtures (execução $GITHUB_RUN_ID)"
          git push -q origin "HEAD:refs/heads/$RAMO"
          echo "Gravado na branch $RAMO"
